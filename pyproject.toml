[project]
name = "pfn-probe"
version = "0.1.0"
description = "PFN Probe: sequential feature acquisition with STOP for TabPFN-3.5"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "tabpfn==9.0.0",
    "pandas",
    "numpy",
    "scikit-learn",
    "torch",
    "flask",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
